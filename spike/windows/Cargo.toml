[package]
name = "shaayi-m0-spike"
version = "0.0.1"
edition = "2021"
description = "Shaayi M0 spike wrapped in Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shaayi-input = { path = "../../shaayi-input" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
local-ip-address = "0.6.13"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSEvent", "NSTouch", "NSWindow", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSSet", "NSEnumerator", "NSObject"] }
