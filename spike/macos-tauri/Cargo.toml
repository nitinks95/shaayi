[package]
name = "shaayi-macos-tauri-spike"
version = "0.0.1"
edition = "2021"
description = "Throwaway: can an overlay NSView receive NSTouch inside a Tauri webview window?"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSEvent", "NSTouch", "NSWindow", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSSet", "NSEnumerator"] }
