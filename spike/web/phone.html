<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#151515" />
  <title>Shaayi phone trackpad</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #151515; color: #eee; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 18px; }
    header, footer { text-align: center; }
    header { font-size: 15px; }
    #status { color: #ffb86c; }
    #pad-wrap { display: grid; place-items: center; min-height: 0; }
    #pad { width: min(92vw, 128vh); max-height: 80vh; aspect-ratio: 16 / 10; border: 2px solid #7e7e7e;
      border-radius: 14px; background: radial-gradient(#303030 1px, transparent 1px) 0 0 / 18px 18px, #202020;
      touch-action: none; user-select: none; -webkit-user-select: none; }
    body.connected #pad { border-color: #f28a35; box-shadow: 0 0 0 2px #f28a3533; }
    footer { color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <header><strong>Shaayi trackpad</strong><br /><span id="status">Pairing…</span></header>
  <main id="pad-wrap"><div id="pad" aria-label="Touch surface"></div></main>
  <footer>One finger writes · two or more fingers make a gesture</footer>
  <script src="/phone.js"></script>
</body>
</html>
